name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Visual Studio generator (CMake's default on Windows): CMakeLists.txt adds /MP so each target's
          # sources compile in parallel.
          - name: MSVC
            os: windows-2025
            cc: cl
            cxx: cl
          - name: GCC
            os: ubuntu-24.04
            generator: Ninja
            cc: gcc-14
            cxx: g++-14
          - name: Clang
            os: ubuntu-24.04
            generator: Ninja
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v4

      # Not --recursive: nanovg's own submodules include SDL, glslang and an SSH-only glew, none of which are used.
      - name: Submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 --jobs 8
          git submodule update --init --recursive --depth 1 --jobs 8 external/meshlet-optimizer
          git -C external/nanovg submodule update --init --depth 1 external/glfw external/Vulkan-Headers

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglfw3-dev libgl-dev libomp-18-dev

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build -A x64   # the newest Visual Studio on the runner
          else
            cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build --config Release --parallel 4
          else
            cmake --build build --parallel 4 -- -k 0   # report every error, not just the first
          fi

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
